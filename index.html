<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>방치형 게임 골드 강화 수식 검증기</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f4f7f6; color: #333; }
        h1 { text-align: center; color: #2c3e50; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #3498db; color: white; }
        input[type="text"] { width: 90%; padding: 8px; box-sizing: border-box; text-align: right; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
        input[type="text"]:focus { border-color: #3498db; outline: none; }
        .stat-name { font-weight: bold; text-align: left; background-color: #ecf0f1; }
        .analysis-result { font-size: 13px; color: #e74c3c; font-weight: bold; }
        .info-box { margin-bottom: 20px; background: #e8f4f8; padding: 15px; border-radius: 6px; border-left: 5px solid #3498db; }
    </style>
</head>
<body>

<div class="container">
    <h1>⚔️ 방치형 게임 골드 강화 데이터 및 산식 검증</h1>
    <div class="info-box">
        <strong>사용 안내:</strong> 각 항목의 현재 <strong>수치</strong>와 <strong>+1 / +10 / +100 강화 비용</strong>을 입력하세요. 숫자를 입력하면 자동으로 천 단위 콤마가 적용되며, 비용 간의 규칙성을 분석합니다.
    </div>

    <table>
        <thead>
            <tr>
                <th>강화 항목</th>
                <th>현재 수치</th>
                <th>+1 강화 비용</th>
                <th>+10 강화 비용</th>
                <th>+100 강화 비용</th>
                <th>규칙성 분석 (비율)</th>
            </tr>
        </thead>
        <tbody id="statTableBody">
            <!-- 자바스크립트로 동적 생성 -->
        </tbody>
    </table>
</div>

<script>
    // 정의된 8가지 강화 항목 (이름과 최대 범위 안내용)
    const stats = [
        { id: 'atk', name: '공격력', max: '30만' },
        { id: 'hp', name: '생명력', max: '30만' },
        { id: 'def', name: '방어력', max: '30만' },
        { id: 'pen', name: '관통력', max: '30만' },
        { id: 'crit_rate', name: '치명타확률', max: '1,000' },
        { id: 'crit_dmg', name: '치명타 데미지', max: '4만' },
        { id: 'ult_rate', name: '궁극치명타확률', max: '1,000' },
        { id: 'ult_dmg', name: '궁극치명타데미지', max: '1만' }
    ];

    const tbody = document.getElementById('statTableBody');

    // 테이블 행 생성
    stats.forEach(stat => {
        let tr = document.createElement('tr');
        tr.innerHTML = `
            <td class="stat-name">${stat.name} <br><span style="font-size:11px; color:#7f8c8d;">(범위: 0~${stat.max})</span></td>
            <td><input type="text" id="${stat.id}_val" placeholder="수치 입력" oninput="formatAndAnalyze('${stat.id}')"></td>
            <td><input type="text" id="${stat.id}_c1" placeholder="+1 비용" oninput="formatAndAnalyze('${stat.id}')"></td>
            <td><input type="text" id="${stat.id}_c10" placeholder="+10 비용" oninput="formatAndAnalyze('${stat.id}')"></td>
            <td><input type="text" id="${stat.id}_c100" placeholder="+100 비용" oninput="formatAndAnalyze('${stat.id}')"></td>
            <td><span id="${stat.id}_result" class="analysis-result">데이터 입력 대기 중</span></td>
        `;
        tbody.appendChild(tr);
    });

    // 숫자 콤마 포맷팅 및 간단 규칙성 분석 함수
    function formatAndAnalyze(prefix) {
        // 각 입력 필드 가져오기
        ['val', 'c1', 'c10', 'c100'].forEach(type => {
            let input = document.getElementById(`${prefix}_${type}`);
            let cleanVal = input.value.replace(/[^0-9]/g, '');
            if (cleanVal) {
                input.value = Number(cleanVal).toLocaleString();
            } else {
                input.value = '';
            }
        });

        // 분석 로직 수행
        let c1 = Number(document.getElementById(`${prefix}_c1`).value.replace(/[^0-9]/g, ''));
        let c10 = Number(document.getElementById(`${prefix}_c10`).value.replace(/[^0-9]/g, ''));
        let c100 = Number(document.getElementById(`${prefix}_c100`).value.replace(/[^0-9]/g, ''));
        let resultSpan = document.getElementById(`${prefix}_result`);

        let analysisText = [];

        if (c1 > 0 && c10 > 0) {
            let ratio10 = (c10 / (c1 * 10)).toFixed(2);
            analysisText.stats = `+10배율: ${ratio10}x`;
            
            // 만약 +10 비용이 (+1비용 * 10)보다 크면 지수(등비) 형태일 가능성 높음
            if (ratio10 > 1.05) {
                analysisText.push(`+10비용이 단순합보다 큼 (지수증가 추정)`);
            } else {
                analysisText.push(`선형 증가 추정`);
            }
        }

        if (c10 > 0 && c100 > 0) {
            let ratio100 = (c100 / c10).toFixed(2);
            analysisText.push(`10배 구간비율: ${ratio100}x`);
        }

        if (analysisText.length > 0) {
            resultSpan.innerHTML = analysisText.join('<br>');
            resultSpan.style.color = '#27ae60';
        } else {
            resultSpan.innerHTML = '데이터 부족';
            resultSpan.style.color = '#e74c3c';
        }
    }
</script>

</body>
</html>
