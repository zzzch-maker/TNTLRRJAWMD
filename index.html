<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>방치형 게임 수식 검증기</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        .input-group { margin-bottom: 15px; }
        input, select { padding: 8px; font-size: 16px; }
    </style>
</head>
<body>
    <h2>게임 데이터 입력 및 산식 검증</h2>
    <div class="input-group">
        <label>레벨 비용 입력: </label>
        <!-- 콤마 자동 변환을 위해 text 타입 사용 -->
        <input type="text" id="costInput" placeholder="숫자 입력 (예: 10000)" oninput="formatNumber(this)">
    </div>
    <div id="result">변환된 실제 값: 0</div>

    <script>
        function formatNumber(input) {
            // 숫자 외의 문자는 모두 제거
            let value = input.value.replace(/[^0-9]/g, '');
            if (value) {
                // 천 단위 콤마 추가
                input.value = Number(value).toLocaleString();
                // 실제 계산에 쓰일 원본 숫자 표시
                document.getElementById('result').innerText = "변환된 실제 값: " + value;
            } else {
                input.value = '';
                document.getElementById('result').innerText = "변환된 실제 값: 0";
            }
        }
    </script>
</body>
</html>
