<!-- [신규 추가] 웹사이트의 UI를 구성하는 기본 HTML 문서입니다. -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI 엑셀 VBA 및 UI 생성기</title>
</head>
<body>
    <h1>철거 현장 맞춤형 VBA 자동 생성기</h1>
    
    <!-- 사용자가 원하는 엑셀 기능과 메뉴를 입력하는 텍스트 영역입니다. -->
    <textarea id="userInput" rows="5" cols="50" placeholder="예: 굴착기 및 덤프트럭 일일 점검 현황을 입력하는 유저폼과 코드를 짜줘."></textarea><br>
    
    <!-- 생성 실행 버튼 -->
    <button onclick="generateVBA()">VBA 및 디자인 생성하기</button>

    <hr>
    
    <!-- AI가 생성한 결과물(이미지와 코드)을 보여줄 영역입니다. -->
    <div id="resultArea">
        <h3>예시 디자인 화면</h3>
        <!-- 이미지 API 결과가 들어갈 태그 -->
        <img id="uiImage" src="" alt="UI 디자인 예시 대기 중..." style="max-width: 500px; display: none;">
        
        <h3>VBA 코드</h3>
        <!-- VBA 코드 API 결과가 들어갈 태그 -->
        <pre id="vbaCode" style="background-color: #f4f4f4; padding: 10px;"></pre>
    </div>

    <!-- 기능 동작을 위한 자바스크립트 파일 연결 -->
    <script src="script.js"></script>
</body>
</html>
